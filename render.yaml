# Render Blueprint: Defender Query Playbook as a static site.
# The library check runs on every deploy; a broken data/alerts.js stops the deploy.
services:
  - type: web
    name: defender-query-playbook
    runtime: static
    buildCommand: node scripts/validate.mjs && node scripts/build.mjs
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      # Always fetch the latest alert library and page after a deploy.
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
