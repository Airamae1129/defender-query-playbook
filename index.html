<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Defender Query Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: SOC console. Sticky header with search + category filters; left rail lists alerts, right pane shows entity fields and the numbered investigation steps (Context -> Query -> How to read it). Stacks to one pane on phones. */
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --sunk:#E9EBE6; --line:#D6D9D2; --fg:#14181B; --muted:#5B6560;
  --accent:#2747C9; --accent-soft:#E3E8FB; --on-accent:#FFFFFF;
  --code-bg:#151A1E; --code-fg:#DCE3E6; --k-kw:#8FB4FF; --k-str:#E6C07B; --k-fn:#7FD6C2; --k-com:#7C8A92; --k-num:#F29E74; --k-tbl:#D7A6FF;
  --sev-high:#B42318; --sev-med:#B54708; --sev-low:#3F6B12; --sev-info:#445059;
  --c-triage:#5A4FCF; --c-endpoint:#0E7C86; --c-identity:#A23E8C; --c-email:#B05A12; --c-cloud:#2F6FB3; --c-team:#3E7D2F; --c-network:#7A5C00; --c-siem:#5E6472;
  --warn-bg:#FFF4E0; --warn-fg:#7A4B00;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101417; --panel:#171C20; --sunk:#1E252A; --line:#2B343A; --fg:#E7ECEE; --muted:#97A3A9;
  --accent:#8EA6FF; --accent-soft:#232C4D; --on-accent:#0D1330;
  --code-bg:#0B0F12; --code-fg:#D6DEE2;
  --sev-high:#FF8A7A; --sev-med:#F5B04F; --sev-low:#9BD36A; --sev-info:#A9B6BD;
  --c-triage:#A79DFF; --c-endpoint:#4FC9D3; --c-identity:#E58BCF; --c-email:#F0A160; --c-cloud:#7DB4F0; --c-team:#8FD07A; --c-network:#E2C46A; --c-siem:#AEB4C0;
  --warn-bg:#3A2A10; --warn-fg:#F6CF8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101417; --panel:#171C20; --sunk:#1E252A; --line:#2B343A; --fg:#E7ECEE; --muted:#97A3A9;
  --accent:#8EA6FF; --accent-soft:#232C4D; --on-accent:#0D1330;
  --code-bg:#0B0F12; --code-fg:#D6DEE2;
  --sev-high:#FF8A7A; --sev-med:#F5B04F; --sev-low:#9BD36A; --sev-info:#A9B6BD;
  --c-triage:#A79DFF; --c-endpoint:#4FC9D3; --c-identity:#E58BCF; --c-email:#F0A160; --c-cloud:#7DB4F0; --c-team:#8FD07A; --c-network:#E2C46A; --c-siem:#AEB4C0;
  --warn-bg:#3A2A10; --warn-fg:#F6CF8A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.brand .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--sev-high)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:8px;overflow-x:auto;padding-block:0 12px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc,var(--muted))}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:.72rem;opacity:.7}

main.grid{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px;padding-block:18px 48px}
.rail{min-width:0}
.rail-list{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px);overflow:auto;padding-right:4px}
.item{display:grid;grid-template-columns:4px 1fr;gap:10px;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px 9px 6px;cursor:pointer;width:100%}
.item:hover{background:var(--sunk)}
.item[aria-current="true"]{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.item .bar{border-radius:3px;background:var(--cc)}
.item .nm{font-weight:600;font-size:.92rem;line-height:1.3;text-wrap:balance}
.item .meta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.rail-empty{color:var(--muted);padding:12px;font-size:.9rem}
.group-h{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}

.detail{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.d-head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}
.d-kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.pill{font-family:var(--f-mono);font-size:.7rem;font-weight:500;border-radius:5px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.cat{border-color:transparent;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc);font-weight:700}
.pill.sev-high{color:var(--sev-high);border-color:color-mix(in srgb,var(--sev-high) 45%,transparent)}
.pill.sev-medium{color:var(--sev-med);border-color:color-mix(in srgb,var(--sev-med) 45%,transparent)}
.pill.sev-low{color:var(--sev-low);border-color:color-mix(in srgb,var(--sev-low) 45%,transparent)}
.pill.sev-info{color:var(--sev-info)}
.pill.mitre{color:var(--fg)}
.pill.snt{background:var(--warn-bg);color:var(--warn-fg);border-color:transparent}
.d-head h2{margin:0 0 6px;font-size:1.55rem;line-height:1.2;letter-spacing:-.015em;text-wrap:balance}
.d-head p{margin:0;color:var(--muted);max-width:72ch}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.byline{font-size:.8rem;color:var(--muted)}

.params{padding:16px 24px;border-bottom:1px solid var(--line);background:var(--sunk)}
.params-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.params-h strong{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.params-h span{font-size:.8rem;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pf{display:flex;flex-direction:column;gap:4px;min-width:0}
.pf label{font-size:.75rem;font-weight:600;color:var(--muted)}
.pf input{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 9px;font-family:var(--f-mono);font-size:.82rem;min-width:0}
.pf input.filled{border-color:var(--accent)}
.autofill{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.autofill label{font-size:.75rem;font-weight:600;color:var(--muted)}
.autofill textarea{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 9px;font-family:var(--f-mono);font-size:.8rem;min-height:64px;resize:vertical;width:100%;box-sizing:border-box}
.af-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.af-bar b{color:var(--fg)}

.steps{padding:6px 24px 24px;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding-top:20px}
.step-n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.8rem}
.step h3{margin:2px 0 8px;font-size:1.05rem;line-height:1.35;text-wrap:balance}
.step h3 small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.code{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:8px;min-width:0}
.code-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid #ffffff14;flex-wrap:wrap}
.code-bar .tbls{display:flex;gap:6px;flex-wrap:wrap}
.code-bar .tbl{font-family:var(--f-mono);font-size:.7rem;color:var(--k-tbl)}
.code-bar .snt{font-family:var(--f-mono);font-size:.68rem;color:var(--k-str)}
.copy{border:1px solid #ffffff2a;background:#ffffff10;color:var(--code-fg);border-radius:6px;padding:3px 10px;font-size:.76rem;font-weight:600;cursor:pointer}
.copy:hover{background:#ffffff22}
pre{margin:0;padding:12px 14px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;line-height:1.6;tab-size:4}
.kw{color:var(--k-kw)} .str{color:var(--k-str)} .fn{color:var(--k-fn)} .com{color:var(--k-com);font-style:italic} .num{color:var(--k-num)} .tb{color:var(--k-tbl);font-weight:700}
.ph{background:#E6C07B26;color:var(--k-str);border-radius:3px;outline:1px dashed #E6C07B80}
.fill{background:#8FB4FF22;border-radius:3px}
.read{margin:10px 0 0;font-size:.9rem;color:var(--fg);max-width:78ch;border-left:2px solid var(--line);padding-left:12px}
.read b{font-weight:700}
.fp{margin:22px 24px 0;padding:12px 14px;border-radius:8px;background:var(--sunk);font-size:.88rem}
.fp strong{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.notice{margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn-fg);font-size:.86rem}

.form{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.form h2{margin:0;font-size:1.35rem}
.form .help{color:var(--muted);font-size:.86rem;margin:0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.78rem;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 10px;min-width:0}
.fld textarea{resize:vertical;min-height:60px}
.fld textarea.kql{font-family:var(--f-mono);font-size:.8rem;min-height:140px;background:var(--sunk)}
.fstep{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fstep-h{display:flex;justify-content:space-between;align-items:center}
.fstep-h strong{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.err{color:var(--sev-high);font-size:.85rem;margin:0}
.tokens{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);line-height:1.8}

footer.src{padding-block:8px 32px;color:var(--muted);font-size:.8rem;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.86rem;font-weight:600;z-index:20}
.back{display:none}

@media (max-width:820px){
  main.grid{grid-template-columns:minmax(0,1fr)}
  .rail-list{position:static;max-height:none}
  body.show-detail .rail{display:none}
  body:not(.show-detail) .detail{display:none}
  .back{display:inline-flex;margin-bottom:10px}
  .d-head,.params,.form{padding-inline:16px}
  .steps{padding-inline:16px}
  .step{grid-template-columns:minmax(0,1fr);gap:6px}
  .fp{margin-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* OSINT tab: Queries / OSINT view switch, access-code gate, indicator cards, results copy block. */
.views{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:2px}
.views button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
body.view-osint #q,body.view-osint .search,body.view-osint #addBtn,body.view-osint #filters,body.view-osint main.grid{display:none!important}
#osint{padding-block:16px 8px}
.os-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.os-grid{grid-template-columns:1fr}}
.os-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.os-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.os-panel h3{margin:0 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.os-panel h3 span{font-family:var(--f-mono);color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500}
.os-muted{color:var(--muted);font-size:.84rem}
.os-err{color:var(--sev-high);font-size:.84rem}
.os-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.os-input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-family:var(--f-mono);font-size:.84rem}
.btn.xs{padding:3px 9px;font-size:.78rem;border-radius:6px}
.ocard{border:1px solid var(--line);border-left:4px solid var(--vb,var(--line));border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.ocard+.ocard{margin-top:10px}
.ocard-h{display:flex;gap:8px;align-items:center}
.ocard-v{font-family:var(--f-mono);font-size:.86rem;word-break:break-all;flex:1}
.kind{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.xbtn{border:0;background:transparent;cursor:pointer;font-size:1.1rem;line-height:1;color:var(--muted)}
.prov{display:flex;flex-direction:column;gap:4px;font-size:.82rem;background:var(--sunk);border-radius:6px;padding:8px}
.prov-row{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.pl{font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);border:1px solid var(--line)}
.pl.ok{color:var(--sev-low)} .pl.error{color:var(--sev-high)} .pl.rate_limited{color:var(--sev-med)} .pl.not_configured{color:var(--muted)}
.vb-Clean{--vb:var(--sev-low)} .vb-Low-risk{--vb:var(--sev-med)} .vb-Malicious{--vb:var(--sev-high)} .vb-Not-checked{--vb:var(--line)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.76rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.ocard-f{display:flex;gap:8px;flex-wrap:wrap}
.ocard-f select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px}
.ocard-f input{flex:1 1 200px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tally div{border:1px solid var(--line);border-top:3px solid var(--vb);border-radius:8px;padding:6px 8px;text-align:center;font-size:.78rem}
.tally b{display:block;font-family:var(--f-mono);font-size:1.2rem}
.shot{max-height:200px;object-fit:cover;object-position:top;width:100%;border:1px solid var(--line);border-radius:6px}
.shot-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.rchip{font-family:var(--f-mono);font-size:.76rem;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:2px 10px;cursor:pointer}
.rchip.off{opacity:.5;text-decoration:line-through}
.copy-wrap{background:var(--code-bg);color:var(--code-fg);border-radius:8px}
.copy-bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:6px 8px;border-bottom:1px solid #ffffff1a;flex-wrap:wrap}
.copy-bar label{margin-right:auto;font-size:.8rem;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.copy-wrap pre{margin:0;padding:12px;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.8rem;max-height:460px;overflow:auto}
.copy-wrap .btn{background:transparent;color:var(--code-fg);border-color:#ffffff33}
.lock{max-width:440px;margin:24px auto}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><h1>Defender Query Playbook</h1><span class="tag">ALERT → CONTEXT → KQL</span></div>
      <label class="search" for="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search alert name, table, MITRE ID…" autocomplete="off"></label>
      <div class="views" role="group" aria-label="View"><button type="button" data-view="queries" aria-pressed="true">Queries</button><button type="button" data-view="osint" aria-pressed="false">OSINT</button></div>
      <button class="btn primary" id="addBtn" type="button">+ Add alert</button>
    </div>
    <div class="filters" id="filters" role="toolbar" aria-label="Filter by category"></div>
  </div>
</header>

<div class="wrap">
  <main class="grid">
    <nav class="rail" aria-label="Alerts"><div class="rail-list" id="list"></div></nav>
    <section class="detail" id="detail" aria-live="polite"></section>
  </main>
  <section id="osint" hidden aria-label="OSINT"></section>
  <footer class="src">Defender Query Playbook · Owner: Aira Mae Bugay · Test every query in your own tenant before relying on it.</footer>
</div>

<script src="data/alerts.js"></script>
<script>

const CATS = {
  Endpoint:{c:"--c-endpoint"}, Identity:{c:"--c-identity"},
  Email:{c:"--c-email"}, "Cloud apps":{c:"--c-cloud"}, Network:{c:"--c-network"}, "SIEM health":{c:"--c-siem"}, Team:{c:"--c-team"}
};

/* Fill-in fields. list:true -> comma-separated input rendered as "a", "b".
   optional:true -> left empty it fills as nothing (use inside dynamic([...])). */
const PARAMS = {
  LOOKBACK:{label:"Look-back window", ph:"7d", def:"7d", raw:true},
  BASELINE:{label:"Baseline window", ph:"30d", def:"30d", raw:true},
  ALERTID:{label:"Alert ID", ph:"da637…"},
  DEVICE:{label:"Device name", ph:"laptop-0123"},
  UPN:{label:"User (UPN)", ph:"user@contoso.com"},
  UPNS:{label:"Users (comma-separated UPNs)", ph:"a@contoso.com, b@contoso.com", list:true},
  ACCOUNT:{label:"Account name (sAMAccountName)", ph:"jdoe"},
  IP:{label:"IP address", ph:"203.0.113.10"},
  IPS:{label:"IP addresses (comma-separated)", ph:"203.0.113.10, 198.51.100.7", list:true},
  COUNTRIES:{label:"Countries (2-letter codes)", ph:"HK, AU", list:true},
  XCOUNTRIES:{label:"Exclude countries (2-letter codes, optional)", ph:"HK, AU", list:true, optional:true},
  SHA1:{label:"File SHA-1", ph:"3395856ce81f2b7382dee72602f798b642f14140"},
  SHA256:{label:"File SHA-256", ph:"e3b0c442…"},
  FILENAME:{label:"File name", ph:"invoice.docm"},
  SENDER:{label:"Sender address", ph:"billing@fake-vendor.com"},
  DOMAIN:{label:"Domain / URL fragment", ph:"fake-vendor.com"},
  MSGID:{label:"NetworkMessageId", ph:"0f1a…"},
  GUEST:{label:"Guest UPN fragment", ph:"jdoe_partner.com"},
  OBJECTID:{label:"Entra object ID", ph:"00000000-0000-…"},
  ACTOR:{label:"Actor / inviter UPN", ph:"admin@contoso.onmicrosoft.com"},

const SENTINEL_TABLES = ["SigninLogs","AADNonInteractiveUserSignInLogs","AuditLogs","SecurityEvent","OfficeActivity","CommonSecurityLog","Syslog","Usage","ThreatIntelligenceIndicator","ThreatIntelIndicators","AzureActivity","Anomalies","AGWAccessLogs","AGWFirewallLogs","AzureDiagnostics","SecurityAlert","SentinelBehaviorInfo","AppDependencies","AppExceptions","AppTraces","AppRequests","AppMetrics","AppPerformanceCounters"];
const XDR_TABLES = ["DeviceNetworkInfo","DeviceProcessEvents","DeviceNetworkEvents","DeviceFileEvents","DeviceRegistryEvents","DeviceLogonEvents","DeviceEvents","DeviceImageLoadEvents","DeviceInfo","AlertInfo","AlertEvidence","EntraIdSignInEvents","EntraIdSpnSignInEvents","AADSignInEventsBeta","IdentityLogonEvents","IdentityDirectoryEvents","IdentityQueryEvents","IdentityInfo","EmailEvents","EmailAttachmentInfo","EmailUrlInfo","EmailPostDeliveryEvents","UrlClickEvents","CloudAppEvents","OAuthAppInfo"];
const ALL_TABLES = [...SENTINEL_TABLES, ...XDR_TABLES];

/* ---------------- Built-in library ---------------- */
const BUILTIN = Array.isArray(window.PLAYBOOK_ALERTS) ? window.PLAYBOOK_ALERTS : [];

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

const state = { cat:"All", q:"", sel:null, team:[], values:{}, editing:null, db:null, user:null, uid:null, canWrite:null, names:{} };
/* Entity values (users, IPs, devices…) live only in memory and are never saved, so
   nothing from an investigation is left in the browser. Wipe what older versions saved. */
try{ localStorage.removeItem("dqp-values") }catch(e){}

function allEntries(){ return [...BUILTIN, ...state.team] }
function tokensIn(entry){
  const set = new Set();
  entry.steps.forEach(s => (s.kql.match(/\{\{([A-Z0-9_]+)\}\}/g)||[]).forEach(t => set.add(t.slice(2,-2))));
  const order = Object.keys(PARAMS);
  return [...set].sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
}
function tablesIn(kql){ return ALL_TABLES.filter(t => new RegExp("\\b"+t+"\\b").test(kql)); }
function needsSentinel(kql){ return SENTINEL_TABLES.some(t => new RegExp("\\b"+t+"\\b").test(kql)); }
function paramVal(tok){
  const v = (state.values[tok] ?? "").trim();
  return v || (PARAMS[tok]?.def ?? "");
}
/* Entity fields accept several comma-separated values. LOOKBACK, BASELINE and
   ALERTID stay single (ALERTID anchors a single alert time). */
const SINGLE_ONLY = new Set(["LOOKBACK","BASELINE","ALERTID","ALERTNAME"]);
function isMulti(tok){ return !!PARAMS[tok] && !PARAMS[tok].list && !SINGLE_ONLY.has(tok); }
function items(tok){ return paramVal(tok).replace(/"/g,"").split(/[,;\s]+/).filter(Boolean); }

/* When a multi field holds 2+ values, rewrite `<col> <op> "{{TOK}}"` before filling:
   == -> in, =~ -> in~, has -> has_any, any other operator -> (col op "a" or col op "b").
   {{TOK__L}} fills as "a", "b" and {{TOK__2}} as the 2nd value. */
const CMP_RE = /(tostring\([^()]*\)|[A-Za-z_][\w.]*)\s+(==|=~|!=|!~|has|!has|contains|!contains|startswith|endswith|has_cs)\s+"\{\{([A-Z0-9]+)\}\}"/g;
function expandMulti(kql){
  const many = tok => isMulti(tok) && items(tok).length > 1;
  return kql.replace(CMP_RE, (m, col, op, tok) => {
    if(!many(tok)) return m;
    if(op === "==") return col+" in ({{"+tok+"__L}})";
    if(op === "=~") return col+" in~ ({{"+tok+"__L}})";
    if(op === "!=") return col+" !in ({{"+tok+"__L}})";
    if(op === "!~") return col+" !in~ ({{"+tok+"__L}})";
    if(op === "has") return col+" has_any ({{"+tok+"__L}})";
    const join = op.startsWith("!") ? " and " : " or ";
    return "(" + items(tok).map((_,i)=>col+" "+op+' "{{'+tok+"__"+(i+1)+'}}"').join(join) + ")";
  }).replace(/"\{\{([A-Z0-9]+)\}\}"/g, (m, tok) => many(tok) ? "{{"+tok+"__L}}" : m);
}
function baseTok(tok){ return tok.split("__")[0]; }
function fillValue(tok){
  const [base, part] = tok.split("__");
  const p = PARAMS[base] || {label:base, ph:base};
  if(p.list || part === "L"){
    const xs = items(base);
    if(!xs.length) return p.optional ? {text:"", empty:false} : {text:'"<'+base+'1>", "<'+base+'2>"', empty:true};
    return {text: xs.map(x=>'"'+x+'"').join(", "), empty:false};
  }
  if(part) return {text: items(base)[+part-1] ?? "", empty:false};
  const v = paramVal(base).replace(/"/g,"");
  if(!v) return {text:"<"+base+">", empty:true};
  return {text:v, empty:false};
}
/* ---------------- auto-fill: pull entities out of pasted alert text ---------------- */
const GUID = "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}";
const FILE_EXT = "exe|dll|ps1|psm1|bat|cmd|vbs|vbe|js|jse|hta|lnk|scr|msi|iso|img|zip|rar|7z|docm|doc|docx|xlsm|xls|xlsx|pptm|one|pdf|html?|svg";
/* Value after a label like "Device name: x", "DeviceName\tx" or "Device  x" (Defender side-panel copy). */
function labeled(text, labels, valRe){
  const re = new RegExp("(?:^|\\n|\\b)(?:"+labels+")\\s*(?:[:=\\t]|\\s{2,}|\\n)\\s*\"?("+valRe+")", "gi");
  return [...text.matchAll(re)].map(m=>m[1]);
}
function extractEntities(raw){
  const text = raw.replace(/\r/g,"");
  const uniq = xs => [...new Set(xs.map(x=>x.trim().replace(/[.,;)\]]+$/,"")).filter(Boolean))];
  const lower = xs => uniq(xs.map(x=>x.toLowerCase()));
  const out = {};

  // Emails: guests (#EXT#), senders and actors by label, the rest are users.
  const emailRe = "[A-Za-z0-9._%+'#-]+@[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}";
  const emails = lower(text.match(new RegExp(emailRe,"g"))||[]);
  const senders = lower(labeled(text, "sender(?:\\s*address)?|sender ?from ?address|from", emailRe));
  const actors = lower(labeled(text, "actor|initiated by|invited by|inviter", emailRe));
  const guests = uniq(emails.filter(e=>/#ext#/i.test(e)).map(e=>e.split(/#ext#/i)[0]));
  const users = emails.filter(e=>!/#ext#/i.test(e) && !senders.includes(e) && !actors.includes(e));
  if(users.length){ out.UPN = users; out.UPNS = users; }
  if(senders.length) out.SENDER = senders;
  if(actors.length) out.ACTOR = actors;
  if(guests.length) out.GUEST = guests;

  // IPv4 (skips 0.0.0.0, loopback and version-number lookalikes) and IPv6.
  const v4 = (text.match(/(?<![\d.])(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)(?![\d.])/g)||[])
    .filter(ip=>!/^(0\.0\.0\.0|127\.)/.test(ip));
  const v6 = (text.match(/(?<![\w:])(?:[0-9a-f]{1,4}:){2,7}(?::|[0-9a-f]{1,4})(?![\w:])/gi)||[]).filter(ip=>ip.includes("::")||ip.split(":").length===8);
  const ips = uniq([...v4, ...v6.map(x=>x.toLowerCase())]);
  if(ips.length){ out.IP = ips; out.IPS = ips; }

  // Hashes: exact-length hex runs.
  const hex = len => lower(text.match(new RegExp("(?<![0-9a-f])[0-9a-f]{"+len+"}(?![0-9a-f])","gi"))||[]);
  if(hex(64).length) out.SHA256 = hex(64);
  if(hex(40).length) out.SHA1 = hex(40);

  // Alert ID: labelled value, else Defender-style ids (da638…, ed…, fa…).
  const alertIds = uniq([...labeled(text, "alert ?id", "[A-Za-z0-9_\\-]{8,}"),
    ...(text.match(/\b(?:da|ed|fa|aa|ar|ca|dl|ra|sa|ta)\d{15,}(?:_-?\d+)?\b/g)||[])]);
  if(alertIds.length) out.ALERTID = [alertIds[0]];

  // GUIDs only when labelled, so an alert ID or tenant ID isn't mistaken for them.
  const g = labels => lower(labeled(text, labels, GUID));
  const objs = g("object ?id|aad ?user ?id|aad ?object ?id|user ?object ?id|target ?object ?id");
  const msgs = g("network ?message ?id|message ?id");
  const apps = g("o?auth ?app ?id|app(?:lication)? ?id|client ?id");
  if(objs.length) out.OBJECTID = objs;
  if(msgs.length) out.MSGID = msgs;
  if(apps.length) out.APPID = apps;

  // Devices: labelled names; keep the host part so startswith also matches the FQDN.
  const devs = uniq(labeled(text, "device ?name|device|computer ?name|computer|host ?name|hostname|host|machine ?name|machine|endpoint", "[A-Za-z0-9][A-Za-z0-9._-]{1,62}")
    .filter(d=>!/^(id|name|details|group|type|info|value)$/i.test(d) && !/^\d+(\.\d+)*$/.test(d))
    .map(d=>d.split(".")[0].toLowerCase()));
  if(devs.length) out.DEVICE = devs;

  // Accounts: DOMAIN\user (not folders inside a C:\ path), else labelled sAMAccountName.
  const accts = uniq([...[...text.matchAll(/(?<![\\\w:.$-])[A-Za-z][A-Za-z0-9-]{0,14}\\([A-Za-z0-9._$-]{2,64})(?![\\\w.$-])/g)].map(m=>m[1]),
    ...labeled(text, "account ?name|sam ?account ?name|samaccountname", "[A-Za-z0-9._$-]{2,64}")].filter(a=>!a.includes("@")));
  if(accts.length) out.ACCOUNT = accts;

  // Files: labelled names, else anything ending in a risky extension (path stripped).
  const fileRe = "[^\\s\\\\/:*?\"<>|]+\\.(?:"+FILE_EXT+")";
  let files = labeled(text, "file ?name|filename|attachment(?: ?name)?|process ?name", fileRe);
  if(!files.length) files = (text.match(new RegExp("[^\\s\\\\/:*?\"<>|'`]+\\.(?:"+FILE_EXT+")(?![\\w.])","gi"))||[]);
  files = uniq(files.map(f=>f.split(/[\\/]/).pop())).filter(f=>!f.includes("@"));
  if(files.length) out.FILENAME = files;

  // Domains: labelled, else hosts from URLs and sender domains.
  const urlHosts = (text.match(/\bhttps?:\/\/[^\s"'<>]+/gi)||[]).map(u=>{ try{ return new URL(u.replace(/[\])>,.]+$/,"")).hostname }catch(e){ return "" } });
  const doms = lower([...labeled(text, "domain|sender ?domain|url ?domain|sender ?from ?domain", "[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)+"),
    ...urlHosts, ...senders.map(s=>s.split("@")[1])]);
  if(doms.length) out.DOMAIN = doms;

  return out;
}
function applyEntities(found){
  Object.entries(found).forEach(([tok, xs]) => { state.values[tok] = xs.join(", "); });
}
function autoFill(text){
  state.paste = text;
  const found = extractEntities(text);
  applyEntities(found);
  const shown = Object.keys(found).filter(t => !PARAMS[t]?.list);
  state.afMsg = !text.trim() ? "" : shown.length
    ? "Filled: " + shown.map(t => "<b>"+esc(PARAMS[t].label.replace(/ \(.*\)$/,""))+"</b> ("+found[t].length+")").join(", ") + ". Check the fields before running."
    : "No users, IPs, devices or hashes found in that text.";
  const ta = $("#afText"), pos = ta && ta.selectionStart;
  renderDetail();
  const nt = $("#afText"); if(nt){ nt.focus(); nt.setSelectionRange(pos, pos); }
}

function filledKql(kql){ return expandMulti(kql).replace(/\{\{([A-Z0-9_]+)\}\}/g, (_,t)=>fillValue(t).text); }

const KW = new Set("where project summarize extend join union let order by sort take limit top distinct count and or not in has has_any has_all contains startswith endswith matches regex between kind inner leftouter rightouter fullouter leftanti leftsemi on asc desc isfuzzy true false mv-expand parse evaluate render getschema as".split(" "));
const FN = /^(ago|now|bin|count|countif|dcount|dcountif|make_set|make_list|min|max|sum|avg|arg_max|arg_min|take_any|tostring|toint|tolong|todynamic|parse_json|extract|isnotempty|isempty|isnull|isnotnull|coalesce|strcat|split|iff|iif|case|datetime_diff|base64_decode_tostring|prev|next|tolower|toupper|format_datetime|array_length|replace_string|ipv4_is_private)$/;
function highlight(kql){
  const re = /(\/\/[^\n]*)|(@?"(?:[^"\\\n]|\\.)*")|(\{\{[A-Z0-9_]+\}\})|(\b\d+(?:\.\d+)?[dhms]?\b)|([A-Za-z_][A-Za-z0-9_\-~]*)|([\s\S])/g;
  let out = "", m;
  while((m = re.exec(kql))){
    const [tok, com, str, ph, num, word] = m;
    if(com) out += '<span class="com">'+esc(com)+'</span>';
    else if(str) out += '<span class="str">'+highlightFills(str)+'</span>';
    else if(ph) out += renderFill(ph.slice(2,-2));
    else if(num) out += '<span class="num">'+esc(num)+'</span>';
    else if(word){
      if(ALL_TABLES.includes(word)) out += '<span class="tb">'+word+'</span>';
      else if(KW.has(word.replace(/~$/,"")) || /^(in~|!in|!has|has_cs)$/.test(word)) out += '<span class="kw">'+esc(word)+'</span>';
      else if(FN.test(word)) out += '<span class="fn">'+word+'</span>';
      else out += esc(word);
    } else out += esc(tok);
  }
  return out;
}
function renderFill(tok){
  const f = fillValue(tok);
  return '<span class="'+(f.empty?"ph":"fill")+'" title="'+esc((PARAMS[baseTok(tok)]||{}).label||tok)+'">'+esc(f.text)+'</span>';
}
function highlightFills(str){
  return str.split(/(\{\{[A-Z0-9_]+\}\})/).map(part => /^\{\{[A-Z0-9_]+\}\}$/.test(part) ? renderFill(part.slice(2,-2)) : esc(part)).join("");
}

/* ---------------- render: filters + list ---------------- */
function matches(e){
  if(state.cat !== "All" && (state.cat === "Team" ? !e.team : e.cat !== state.cat)) return false;
  if(!state.q) return true;
  const hay = [e.name, e.cat, e.src, e.summary, (e.mitre||[]).join(" "), e.steps.map(s=>s.ctx+" "+s.kql).join(" ")].join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function renderFilters(){

}
function renderList(){

      </button>`;

  ).join("");
}

function renderForm(){

      ${!state.db ? `<p class="notice">This copy is running from your computer, so entries can't be saved here. Fill in the form, then use <b>Copy as JSON</b> and paste the result into <b>data/alerts.js</b> (or ask Claude Code to add it).</p>` : state.canWrite===false ? `<p class="notice">Your access to this page is view-only, so you can't save entries. Ask the owner for Contributor access.</p>` : ""}
      <div class="frow">
        <div class="fld" style="grid-column:1/-1"><label for="f-name">Alert name</label><input id="f-name" value="${esc(f.name)}" placeholder="e.g. Suspicious inbox manipulation rule" required></div>
      </div>
      <div class="frow">
        <div class="fld"><label for="f-cat">Category</label><select id="f-cat">${["Endpoint","Identity","Email","Cloud apps","Network","SIEM health"].map(c=>`<option ${f.cat===c?"selected":""}>${c}</option>`).join("")}</select></div>
        <div class="fld"><label for="f-sev">Severity</label><select id="f-sev">${["high","medium","low","info"].map(c=>`<option value="${c}" ${f.sev===c?"selected":""}>${c[0].toUpperCase()+c.slice(1)}</option>`).join("")}</select></div>
        <div class="fld"><label for="f-src">Source product</label><input id="f-src" value="${esc(f.src)}" placeholder="Defender for Endpoint"></div>
        <div class="fld"><label for="f-mitre">MITRE IDs</label><input id="f-mitre" value="${esc(f.mitre)}" placeholder="T1110, T1078"></div>
      </div>
      <div class="fld"><label for="f-sum">What this alert means (optional)</label><textarea id="f-sum" rows="2">${esc(f.summary)}</textarea></div>
      <div id="fsteps" style="display:flex;flex-direction:column;gap:12px">
        ${f.steps.map((s,i)=>`<div class="fstep" data-i="${i}">
          <div class="fstep-h"><strong>Step ${i+1}</strong>${f.steps.length>1?`<button type="button" class="btn ghost danger" data-rm="${i}">Remove</button>`:""}</div>
          <div class="fld"><label for="f-ctx-${i}">Context</label><input id="f-ctx-${i}" data-k="ctx" value="${esc(s.ctx)}" placeholder="Are the alert IPs normal for the tenant? (30 days)"></div>
          <div class="fld"><label for="f-kql-${i}">Query</label><textarea id="f-kql-${i}" data-k="kql" class="kql" spellcheck="false">${esc(s.kql)}</textarea></div>
          <div class="fld"><label for="f-read-${i}">How to read the result (optional)</label><textarea id="f-read-${i}" data-k="read" rows="2">${esc(s.read)}</textarea></div>
        </div>`).join("")}
      </div>
      <div><button type="button" class="btn" id="addStep">+ Add step</button></div>
      <p class="tokens">Fill-in tokens: ${Object.keys(PARAMS).map(t=>`{{${t}}}`).join(" ")}<br>Wrap single values in quotes, for example <span>where IPAddress == "{{IP}}"</span>. List tokens go without quotes: <span>where IPAddress in ({{IPS}})</span>.</p>
      <div class="fld"><label for="f-fp">Common false positives (optional)</label><textarea id="f-fp" rows="2">${esc(f.fp)}</textarea></div>
      <p class="err" id="ferr" hidden></p>
      <div class="d-actions"><button type="submit" class="btn primary" ${canWrite?"":"disabled"}>${f.id?"Save changes":"Save to playbook"}</button>${!state.db?`<button type="button" class="btn" id="copyJson">Copy as JSON</button>`:""}<button type="button" class="btn" id="cancelForm">Cancel</button></div>
    </form>`;
}
function readForm(){
  const f = state.editing;
  f.name = $("#f-name").value.trim(); f.cat = $("#f-cat").value; f.sev = $("#f-sev").value;
  f.src = $("#f-src").value.trim(); f.mitre = $("#f-mitre").value.trim(); f.summary = $("#f-sum").value.trim(); f.fp = $("#f-fp").value.trim();
  f.steps = [...document.querySelectorAll(".fstep")].map(el => ({
    ctx: el.querySelector('[data-k="ctx"]').value.trim(),
    kql: el.querySelector('[data-k="kql"]').value.replace(/\s+$/,""),
    read: el.querySelector('[data-k="read"]').value.trim()
  }));
}

/* ---------------- events ---------------- */
document.addEventListener("click", async ev => {
  const chip = ev.target.closest(".chip");
  if(chip){ state.cat = chip.dataset.cat; renderFilters(); renderList(); return; }
  const item = ev.target.closest(".item");
  if(item){ state.editing=null; state.sel = item.dataset.id; renderList(); renderDetail(); document.body.classList.add("show-detail"); window.scrollTo({top:0}); return; }
  if(ev.target.closest("#backBtn")){ document.body.classList.remove("show-detail"); if(state.editing){state.editing=null; renderDetail();} return; }
  const cp = ev.target.closest("[data-copy]");
  if(cp){
    const e = allEntries().find(x=>x.id===state.sel); const s = e.steps[+cp.dataset.copy];
    const text = filledKql(s.kql);
    const empties = (s.kql.match(/\{\{([A-Z0-9_]+)\}\}/g)||[]).map(t=>t.slice(2,-2)).filter(t=>fillValue(t).empty);
    try{ await navigator.clipboard.writeText(text); toast(empties.length ? "Copied. Still to fill: "+[...new Set(empties)].join(", ") : "Query copied"); }
    catch(err){ const pre = cp.closest(".code").querySelector("pre"); const r=document.createRange(); r.selectNodeContents(pre); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Press Ctrl+C to copy"); }
    return;
  }
  if(ev.target.closest("#afClear")){ state.values = {}; state.paste = ""; state.afMsg = ""; renderDetail(); return; }
  if(ev.target.closest("#addBtn")){ state.editing = blankEntry(); renderDetail(); document.body.classList.add("show-detail"); window.scrollTo({top:0}); return; }
  if(ev.target.closest("#cancelForm")){ state.editing=null; renderDetail(); return; }
  if(ev.target.closest("#copyJson")){
    readForm(); const f = state.editing;
    const slug = (f.name||"new-alert").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
    const entry = { id:slug, name:f.name, cat:f.cat, src:f.src, sev:f.sev, mitre:f.mitre.split(/[,\s]+/).filter(Boolean), summary:f.summary,
      steps:f.steps.filter(s=>s.ctx||s.kql).map(s=>({ctx:s.ctx, kql:s.kql, read:s.read})), fp:f.fp };
    const text = JSON.stringify(entry,null,2) + ",";
    try{ await navigator.clipboard.writeText(text); toast("Copied. Paste it inside the list in data/alerts.js"); }
    catch(e){ toast("Copy failed. Your browser blocked clipboard access."); }
    return;
  }
  if(ev.target.closest("#addStep")){ readForm(); state.editing.steps.push({ctx:"",kql:"",read:""}); renderForm(); return; }
  const rm = ev.target.closest("[data-rm]");
  if(rm){ readForm(); state.editing.steps.splice(+rm.dataset.rm,1); renderForm(); return; }
  if(ev.target.closest("#editBtn")){
    const e = state.team.find(x=>x.id===state.sel); if(!e) return;
    state.editing = {id:e.id, name:e.name, cat:e.cat, sev:e.sev||"medium", src:e.src||"", mitre:(e.mitre||[]).join(", "), summary:e.summary||"", fp:e.fp||"", steps:e.steps.map(s=>({ctx:s.ctx, kql:s.kql, read:s.read||""}))};
    renderForm(); return;
  }
  const del = ev.target.closest("#delBtn");
  if(del){
    if(del.dataset.confirm !== "1"){ del.dataset.confirm="1"; del.textContent="Click again to delete"; setTimeout(()=>{ if(del.isConnected){del.dataset.confirm=""; del.textContent="Delete";} },4000); return; }
    try{ await state.db.collection("entries").doc(state.sel).delete(); state.sel = BUILTIN[0].id; toast("Deleted"); }
    catch(err){ toast("Couldn't delete: "+(err.message||err.code)); }
    return;
  }
});
document.addEventListener("input", ev => {
  if(ev.target.id === "q"){ state.q = ev.target.value.trim(); renderList(); return; }
  if(ev.target.id === "afText"){ clearTimeout(state._af); state._af = setTimeout(()=>autoFill(ev.target.value), 250); return; }
  const tok = ev.target.dataset?.tok;
  if(tok){ state.values[tok] = ev.target.value; ev.target.classList.toggle("filled", !!ev.target.value); refreshCode(); }
});
document.addEventListener("submit", async ev => {
  if(ev.target.id !== "entryForm") return;
  ev.preventDefault(); readForm();
  const f = state.editing, err = $("#ferr");
  const steps = f.steps.filter(s=>s.ctx || s.kql);
  let msg = "";
  if(!f.name) msg = "Give the alert a name.";
  else if(!steps.length || steps.some(s=>!s.kql.trim())) msg = "Each step needs a query.";
  else if(steps.some(s=>!s.ctx)) msg = "Each step needs a Context line describing what the query answers.";
  if(msg){ err.textContent = msg; err.hidden = false; return; }
  err.hidden = true;
  const doc = { name:f.name.slice(0,200), cat:f.cat, sev:f.sev, src:f.src.slice(0,120), summary:f.summary.slice(0,1000), fp:f.fp.slice(0,1000),
    mitre: f.mitre.split(/[,\s]+/).filter(Boolean).slice(0,10),
    steps: steps.slice(0,15).map(s=>({ctx:s.ctx.slice(0,300), kql:s.kql.slice(0,8000), read:s.read.slice(0,1500)})),
    updatedAt: new Date().toISOString() };
  const btn = ev.target.querySelector('button[type="submit"]'); btn.disabled = true;
  try{
    if(f.id){ await state.db.collection("entries").doc(f.id).update(doc); state.sel = f.id; }
    else { doc.author = state.uid || ""; doc.createdAt = doc.updatedAt; const ref = await state.db.collection("entries").add(doc); state.sel = ref.id; }
    state.editing = null; toast("Saved to playbook"); renderDetail(); renderList();
  }catch(e){
    btn.disabled = false;
    if(e.code === "invalid_argument"){ state.canWrite = false; err.textContent = "You don't have permission to save here. Ask the page owner for Contributor access."; }
    else if(e.code === "quota_exceeded"){ err.textContent = "The playbook is full. Delete old entries before adding more."; }
    else err.textContent = "Couldn't save: " + (e.message || e.code);
    err.hidden = false;
  }
});

/* ---------------- shared store ---------------- */
async function resolveNames(){
  const ids = [...new Set(state.team.map(e=>e.author).filter(Boolean))].filter(id=>!(id in state.names));
  if(!ids.length || !state.user?.profiles) return;
  try{ const ps = await state.user.profiles(ids); ids.forEach(id => state.names[id] = (ps[id] && ps[id].name) || "a teammate"); }catch(e){}
}
async function connect(){
  if(!window.claude?.use) return;
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    state.db = db; state.user = user;
    if(user){
      try{ state.uid = await user.id(); }catch(e){}
      try{ const c = await user.can("data.write"); state.canWrite = c===null ? null : !!c; }catch(e){}
      try{ state.canEditFlag = await user.canEdit(); }catch(e){}
    }
    if(!db) return;
    db.collection("entries").orderBy("createdAt","desc").onSnapshot(async snap => {
      state.team = snap.docs.map(d => { const x = d.data(); return {
        id:d.id, team:true, name:String(x.name||"Untitled"), cat:CATS[x.cat]?String(x.cat):"Endpoint", sev:String(x.sev||"medium"),
        src:String(x.src||""), summary:String(x.summary||""), fp:String(x.fp||""), mitre:Array.isArray(x.mitre)?x.mitre.map(String):[],
        steps:(Array.isArray(x.steps)?x.steps:[]).map(s=>({ctx:String(s.ctx||""), kql:String(s.kql||""), read:String(s.read||""), team:true})),
        author:String(x.author||""), createdAt:x.createdAt }; });
      await resolveNames();
      renderFilters(); renderList();
      if(!state.editing) renderDetail();
    }, () => {});
  }catch(e){}
}

/* ---------------- boot ---------------- */
state.sel = store.get("dqp-sel") || (BUILTIN[0] && BUILTIN[0].id);
renderFilters(); renderList(); renderDetail();
new MutationObserver(()=>store.set("dqp-sel", state.sel||"")).observe($("#detail"), {childList:true});
connect();
</script>

<script>
/* ================= OSINT tab =================
   Lookups run on the playbook server (server.mjs) with server-held API keys, behind a team access code.
   Indicators, results and screenshot links live only in this page's memory and clear on reload. */
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ss = { get(k){ try{ return sessionStorage.getItem(k) }catch(e){ return null } }, set(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v) }catch(e){} } };
const ls = { get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };
const note = (msg) => { const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); };

const VERDICTS = ["Not checked","Clean","Low risk","Malicious"];
const LABEL = { ip:"IP", domain:"Domain", url:"URL", hash:"Hash" };
const STATUS = { ok:"ok", error:"error", not_configured:"Not configured", rate_limited:"rate limited" };
const vcls = v => "vb-" + v.replace(/\s+/g,"-");
const e = encodeURIComponent;
const LINKS = {
  IP: v => [["AbuseIPDB",`https://www.abuseipdb.com/check/${v}`],["VirusTotal",`https://www.virustotal.com/gui/ip-address/${v}`],["urlscan.io",`https://urlscan.io/search/#ip:${v}`],["Shodan",`https://www.shodan.io/host/${v}`],["AlienVault OTX",`https://otx.alienvault.com/indicator/ip/${v}`],["Cisco Talos",`https://talosintelligence.com/reputation_center/lookup?search=${v}`]],
  Domain: v => [["VirusTotal",`https://www.virustotal.com/gui/domain/${v}`],["urlscan.io",`https://urlscan.io/search/#domain:${v}`],["OTX",`https://otx.alienvault.com/indicator/domain/${v}`],["Talos",`https://talosintelligence.com/reputation_center/lookup?search=${v}`],["ICANN WHOIS",`https://lookup.icann.org/en/lookup?name=${v}`]],
  URL: v => [["VirusTotal",`https://www.virustotal.com/gui/search/${e(v)}`],["urlscan.io",`https://urlscan.io/search/#${e(`page.url:"${v}"`)}`],["URLhaus",`https://urlhaus.abuse.ch/browse.php?search=${e(v)}`]],
  Hash: v => [["VirusTotal",`https://www.virustotal.com/gui/file/${v}`],["MalwareBazaar",`https://bazaar.abuse.ch/browse.php?search=${e(`sha256:${v}`)}`],["Hybrid Analysis",`https://www.hybrid-analysis.com/search?query=${v}`],["OTX",`https://otx.alienvault.com/indicator/file/${v}`]],
};

const S = { server:null, code: ss.get("dqp-osint-code") || "", info:null, items:[], shots:[], busy:{}, err:"", lockErr:"", defang: ls.get("dqp-osint-defang")==="1" };

async function call(path, body){
  let res;
  try{
    res = await fetch(path, { method: body ? "POST" : "GET", credentials:"same-origin",
      headers: { "Accept":"application/json", "X-Requested-With":"XMLHttpRequest", ...(S.code ? {"X-Access-Code": S.code} : {}), ...(body ? {"Content-Type":"application/json"} : {}) },
      body: body ? JSON.stringify(body) : undefined });
  }catch(err){ throw Object.assign(new Error("Can't reach the playbook server."), {status:0}); }
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw Object.assign(new Error(j?.error?.message || `HTTP ${res.status}`), {status:res.status, code:j?.error?.code});
  return j;
}

/* ---- defang for copied text (same rules as SOC Triage Desk) ---- */
const FILE_EXT = new Set("exe dll sys ps1 psm1 psd1 bat cmd vbs vbe js jse wsf hta lnk scr msi msp iso img vhd zip rar 7z gz tgz tar cab doc docx docm dot xls xlsx xlsm xlsb ppt pptx pptm one pdf rtf txt log csv tsv json xml html htm mht ini cfg conf dat tmp bak old png jpg jpeg gif svg webp bmp ico py sh pl rb php asp aspx jsp db sqlite sql evtx etl md yml yaml toml jar class apk dmg pkg deb rpm".split(" "));
const SOURCE_NAMES = new Set(["urlscan.io","virustotal.com","abuseipdb.com","screenshotbase.com"]);
const DEFANG_RE = new RegExp([/\bhttps?:\/\/[^\s<>"'`)\]]+/.source, /\b[\w.+%-]+@(?:[A-Za-z0-9-]+\.)+[a-z]{2,24}\b/.source, /\b(?:\d{1,3}\.){3}\d{1,3}\b/.source, /\b(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[a-z]{2,24}\b/.source].map(x=>`(${x})`).join("|"), "g");
const dots = x => x.replace(/\./g,"[.]");
function defangText(text){
  return String(text ?? "").replace(DEFANG_RE, (m, url, email, ip, dom) => {
    if(url){ if(/\.(png|jpe?g|gif|webp)(\?|#|$)/i.test(url)) return url; const [, sch, host, rest] = url.match(/^(https?):\/\/([^/?#]*)(.*)$/i); return `${sch.replace(/t/gi,"x")}://${dots(host)}${rest}`; }
    if(email){ const [u,d] = email.split("@"); return `${u}[@]${dots(d)}`; }
    if(ip) return ip.split(".").every(o=>+o<=255) ? dots(ip) : ip;
    const tld = dom.slice(dom.lastIndexOf(".")+1);
    return FILE_EXT.has(tld) || SOURCE_NAMES.has(dom.toLowerCase()) ? dom : dots(dom);
  });
}

/* ---- copy format (same as SOC Triage Desk "Results") ---- */
function srcLine(name, d, err){
  if(err) return err;
  if(!d) return "Not checked";
  if(name==="abuseipdb") return `${d.score}% abuse confidence, ${d.reports} reports${d.isp?` – ${d.isp}`:""}${d.country?` (${d.country})`:""}${d.usageType?`, ${d.usageType}`:""}`;
  if(name==="virustotal") return d.found ? `${d.malicious}/${d.total} malicious, ${d.suspicious} suspicious${d.asOwner?` – ${d.asOwner}`:""}` : "Not found";
  const link = d.latest?.result;
  return `${d.hits} existing scans, ${d.malicious?`${d.malicious} flagged malicious`:"none flagged malicious"}${link?` – latest: ${link}`:""}`;
}
const normUrl = u => String(u||"").trim().toLowerCase().replace(/^https?:\/\//,"").replace(/\/+$/,"");
const hostOf = u => normUrl(u).split(/[/?#]/)[0].replace(/^www\./,"");
const shotMatches = (it, sh) => it.type==="domain" ? hostOf(sh.page)===it.value.replace(/^www\./,"") : normUrl(sh.page)===normUrl(it.value);
function summary(){
  const items = S.items.filter(i=>!i.hidden);
  const grp = { ip:[], web:[], hash:[] };
  items.forEach(i => grp[i.type==="ip"?"ip":i.type==="hash"?"hash":"web"].push(i));
  const used = new Set();
  const block = (i, sources) => {
    const rs = i.lookup?.results || [];
    const by = Object.fromEntries(rs.map(r=>[r.provider, r]));
    const L = [`${i.value}${i.type!=="ip"?` (${LABEL[i.type]})`:""}`,
      ...sources.map(([k,label]) => { const r = by[k]; return `${label}: ${r ? srcLine(k, r.status==="ok"?r.data:null, r.status!=="ok"&&r.status!=="not_configured" ? (r.error||STATUS[r.status]) : null) : "Not checked"}`; })];
    if(i.type!=="ip" && i.type!=="hash") S.shots.filter(sh=>shotMatches(i, sh)).forEach(sh => { used.add(sh.url); L.push(`Screenshotbase (URL to image): ${sh.url}`); });
    L.push(`Verdict: ${i.verdict}${i.note ? ` – ${i.note}` : ""}`);
    return L.join("\n");
  };
  const L = [];
  if(grp.ip.length) L.push("IP(s) Reputation:", grp.ip.map(i=>block(i,[["abuseipdb","AbuseIPDB"],["virustotal","VirusTotal"]])).join("\n\n"), "");
  if(grp.web.length) L.push("URL/Domain Reputation:", grp.web.map(i=>block(i,[["virustotal","VirusTotal"],["urlscan","URLscan.io"]])).join("\n\n"), "");
  if(grp.hash.length) L.push("File Hash Reputation:", grp.hash.map(i=>block(i,[["virustotal","VirusTotal"]])).join("\n\n"), "");
  const rest = S.shots.filter(sh=>!used.has(sh.url));
  if(rest.length) L.push("Screenshotbase (URL to image):", ...rest.map(sh=>`${sh.page} → ${sh.url}`), "");
  return L.length ? L.join("\n").trim() : "Nothing in results yet. Add indicators to check.";
}

/* ---- one readable line per provider ---- */
function provLine(r){
  const d = r.data;
  if(r.status!=="ok" || !d) return r.error || STATUS[r.status];
  switch(r.provider){
    case "abuseipdb": return `${d.score}% confidence · ${d.reports} reports${d.isp?` · ${d.isp}`:""}${d.country?` (${d.country})`:""}${d.usageType?` · ${d.usageType}`:""}${d.isTor?" · Tor":""}`;
    case "virustotal": return d.found ? `${d.malicious}/${d.total} malicious · ${d.suspicious} suspicious · ${d.harmless} harmless${d.reputation!=null?` · reputation ${d.reputation}`:""}${d.asOwner?` · ${d.asOwner}`:""}` : "Not found";
    case "urlscan": return `${d.hits} existing scans${d.malicious?` · ${d.malicious} flagged malicious`:""}`;
    case "shodan": return d.found ? `${d.ports.length?`ports ${d.ports.slice(0,10).join(", ")}`:"no open ports"}${d.org?` · ${d.org}`:""}${d.vulns?` · ${d.vulns} CVEs`:""}` : "Not found";
    case "otx": return `${d.pulses} pulses${d.tags?.length?` · ${d.tags.slice(0,5).join(", ")}`:""}`;
  }
  return "";
}
const when = iso => { try{ return new Date(iso).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) }catch(e){ return "" } };

/* ---- rendering ---- */
function render(){
  const root = $("#osint");
  if(S.server===false){
    root.innerHTML = `<div class="os-panel lock"><h3>OSINT</h3><p>OSINT lookups need the playbook server, which holds the API keys.</p><p class="os-muted">Run <b>node server.mjs</b> in the playbook folder and open the address it prints, or use the hosted copy. Opening index.html straight from disk can't run lookups.</p></div>`;
    return;
  }
  if(S.server && !S.server.enabled){
    root.innerHTML = `<div class="os-panel lock"><h3>OSINT</h3><p>OSINT is turned off on this server.</p><p class="os-muted">Set <b>PLAYBOOK_ACCESS_CODE</b> and the provider API keys in the server's settings (.env locally, Environment on Render), then restart.</p></div>`;
    return;
  }
  if(!S.info){
    root.innerHTML = `<form class="os-panel lock" id="osLock"><h3>OSINT</h3><p class="os-muted">Enter the team access code to run lookups with the server's API keys. It is kept only for this browser tab.</p>
      <div class="os-row"><input class="os-input" id="osCode" type="password" autocomplete="off" placeholder="Access code" value=""><button class="btn primary">Unlock</button></div>
      ${S.lockErr?`<p class="os-err" role="alert">${esc(S.lockErr)}</p>`:""}</form>`;
    return;
  }
  const items = S.items, anyBusy = Object.values(S.busy).some(Boolean);
  const tally = VERDICTS.map(v => [v, items.filter(i=>i.verdict===v).length]);
  const text = summary();
  root.innerHTML = `<div class="os-grid">
    <div class="os-col">
      <div class="os-panel"><h3>Indicators to check <span>${items.length}</span></h3>
        ${items.length ? items.map(card).join("") : `<p class="os-muted">Nothing to check yet. Add IPs, domains, URLs or hashes on the right.</p>`}
      </div>
    </div>
    <div class="os-col">
      <div class="os-panel"><h3>Add indicators</h3>
        <form class="os-row" id="osAdd"><input class="os-input" id="osAddIn" placeholder="IPs, domains, URLs or hashes (spaces or commas)" autocomplete="off"><button class="btn primary">Add</button></form>
        ${S.err?`<p class="os-err" role="alert">${esc(S.err)}</p>`:""}
      </div>
      <div class="os-panel"><h3>Lookups</h3>
        <p class="os-muted">Lookups run on the server with the team's API keys and are cached for ${S.info.cacheHours} hours. IPs: AbuseIPDB and VirusTotal; URLs and domains: VirusTotal and urlscan.io search; hashes: VirusTotal. A verdict you set by hand is kept.</p>
        <div class="os-row"><button class="btn primary" data-os="all" ${!items.length||anyBusy?"disabled":""}>${anyBusy?"Running…":`Run all (${items.length})`}</button>
          <button class="btn ghost" data-os="lock" title="Forget the access code in this tab">Lock</button></div>
        <div class="os-row" style="margin-top:8px">${S.info.providers.map(p=>`<span class="pl ${p.configured?"ok":"not_configured"}">${esc(p.label)}: ${p.configured?"on":"Not configured"}</span>`).join("")}</div>
      </div>
      <div class="os-panel"><h3>Reputation tally</h3>
        <div class="tally">${tally.map(([v,n])=>`<div class="${vcls(v)}"><b>${n}</b>${esc(v)}</div>`).join("")}</div>
        <p class="os-muted" style="margin-bottom:0">Do not look up or scan client-internal URLs. Private and internal addresses are refused by the server.</p>
      </div>
      <div class="os-panel"><h3>Screenshotbase (URL to image) <span>${S.info.screenshotsToday} today</span></h3>
        <p class="os-muted">Optional. Type a URL and confirm to get a hosted PNG link for the ticket. Each screenshot uses the API quota, so nothing runs until you confirm.</p>
        <form class="os-row" id="osShot"><input class="os-input" id="osShotIn" placeholder="https://example.com/login" autocomplete="off"><button class="btn primary" ${S.info.screenshot?"":"disabled"}>Generate</button></form>
        ${S.info.screenshot?"":`<p class="os-muted">Screenshot API key not configured.</p>`}
        ${S.shots.length?`<ul class="shot-list">${[...S.shots].reverse().map(sh=>`<li><a href="${esc(sh.url)}" target="_blank" rel="noopener noreferrer"><img class="shot" src="${esc(sh.url)}" alt="Screenshot of ${esc(sh.page)}"></a>
          <div class="os-muted" style="font-family:var(--f-mono);word-break:break-all">${esc(sh.page)}</div>
          <div class="os-row"><button class="btn xs" data-os="copyshot" data-v="${esc(sh.url)}">Copy image URL</button><a class="btn xs" href="${esc(sh.url)}" target="_blank" rel="noopener noreferrer">Open</a><button class="btn xs" data-os="rmshot" data-v="${esc(sh.url)}">Remove</button></div></li>`).join("")}</ul>`:""}
      </div>
      <div class="os-panel"><h3>Results</h3>
        ${items.length?`<div class="chips"><span class="os-muted">In results (× to leave one out):</span>${items.map(i=>`<button class="rchip ${i.hidden?"off":""}" data-os="hide" data-v="${esc(i.value)}" title="${i.hidden?"Add back to results":"Remove from results"}">${esc(i.value)} ${i.hidden?"+":"×"}</button>`).join("")}</div>`:""}
        <div class="copy-wrap"><div class="copy-bar"><label><input type="checkbox" id="osDefang" ${S.defang?"checked":""}> Defang indicators</label>
          <button class="btn xs" data-os="clear" ${!items.length&&!S.shots.length?"disabled":""}>Clear</button><button class="btn xs" data-os="copy">Copy</button></div>
          <pre id="osText">${esc(S.defang?defangText(text):text)}</pre></div>
      </div>
    </div></div>`;
}

function card(it, i){
  const kind = LABEL[it.type], web = it.type==="url"||it.type==="domain", busy = !!S.busy[it.value];
  const shot = [...S.shots].reverse().find(sh => shotMatches(it, sh));
  const urlscanOn = S.info.providers.some(p=>p.name==="urlscan"&&p.configured);
  const L = it.lookup;
  return `<article class="ocard ${vcls(it.verdict)}" data-i="${i}">
    <div class="ocard-h"><span class="kind">${kind}</span><span class="ocard-v">${esc(it.value)}</span><button class="xbtn" data-os="rm" data-v="${esc(it.value)}" aria-label="Remove indicator">×</button></div>
    <div class="os-row">
      <button class="btn xs primary" data-os="run" data-v="${esc(it.value)}" ${busy?"disabled":""}>${busy?"Running…":"Run lookups"}</button>
      ${L?`<button class="btn xs" data-os="refresh" data-v="${esc(it.value)}" ${busy?"disabled":""} title="Skip the cache and ask the providers again">Refresh</button>`:""}
      ${web&&urlscanOn?`<button class="btn xs" data-os="scan" data-v="${esc(it.value)}">Scan</button>`:""}
      ${web&&S.info.screenshot?`<button class="btn xs" data-os="shot" data-v="${esc(it.value)}">Screenshot</button>`:""}
    </div>
    ${L?`<div class="prov">${L.results.map(r=>`<div class="prov-row"><b>${esc(r.label)}</b><span class="pl ${r.status}">${STATUS[r.status]}</span>${r.status==="not_configured"?"":`<span>${esc(provLine(r))}</span>`}${r.provider==="urlscan"&&r.data?.latest?.result?` <a href="${esc(r.data.latest.result)}" target="_blank" rel="noopener noreferrer">latest scan</a>`:""}${r.fetchedAt?` <span class="os-muted">${r.cached?"cached":"fetched"} ${esc(when(r.fetchedAt))}</span>`:""}</div>`).join("")}
      ${L.summary?`<div style="font-family:var(--f-mono);word-break:break-word">${esc(L.summary)}</div>`:""}</div>`:""}
    ${shot?`<a href="${esc(shot.url)}" target="_blank" rel="noopener noreferrer"><img class="shot" src="${esc(shot.url)}" alt="Screenshot of ${esc(it.value)}"></a>`:""}
    <div class="links">${LINKS[kind](it.value).map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n)} ↗</a>`).join("")}</div>
    <div class="ocard-f"><select data-os="verdict" data-v="${esc(it.value)}" aria-label="Verdict">${VERDICTS.map(v=>`<option ${v===it.verdict?"selected":""}>${v}</option>`).join("")}</select>
      <input class="os-input" data-os="note" data-v="${esc(it.value)}" placeholder="${esc(L?.summary || "Finding note (e.g. AbuseIPDB 0%, VT 0/94)")}" value="${esc(it.note)}"></div>
    ${L?`<p class="os-muted" style="margin:0">Suggested: <b>${esc(L.verdict)}</b>${it.manual&&L.verdict!==it.verdict?" · your verdict is kept":""}</p>`:""}
  </article>`;
}

/* ---- actions ---- */
const find = v => S.items.find(i=>i.value===v);
async function unlock(code){
  S.code = code; S.lockErr = "";
  try{ S.info = await call("/api/osint/check", {}); ss.set("dqp-osint-code", code); }
  catch(err){ S.info = null; S.code = ""; ss.set("dqp-osint-code", null); S.lockErr = err.message; }
  render();
}
async function run(it, force){
  S.busy[it.value] = true; render();
  try{
    const r = await call("/api/osint/lookup", { indicator: it.value, type: it.type, force });
    it.lookup = r; if(!it.manual) it.verdict = r.verdict;
    const bad = r.results.filter(x=>x.status==="error"||x.status==="rate_limited");
    if(bad.length) note(`${it.value}: ${bad.map(x=>`${x.label} ${STATUS[x.status]}`).join(", ")}`);
  }catch(err){ if(err.status===401){ S.info=null; S.lockErr="Access code no longer accepted. Enter it again."; } else note(`${it.value}: ${err.message}`); }
  finally{ S.busy[it.value] = false; render(); }
}
async function confirmRun(kind, raw){
  const u = String(raw||"").trim(); if(!u) return note("Enter the URL first.");
  const url = /^https?:\/\//i.test(u) ? u : `https://${u}`;
  const msg = kind==="shot"
    ? `Take a screenshot?\n\nThis sends ${url} to screenshotbase.com, which loads the page and stores the PNG at a public link. Each screenshot uses the API quota (${S.info.screenshotsToday} taken today). Don't use it on URLs that identify the client.`
    : `Submit a urlscan.io scan?\n\nurlscan.io will load ${url} from its servers. The scan is submitted as private, but it still uses the team's scan quota. Never scan client-internal URLs.`;
  if(!window.confirm(msg)) return;
  try{
    if(kind==="shot"){
      const r = await call("/api/osint/screenshot", { url, confirmed:true });
      S.shots.push({ page:r.page, url:r.url, taken_at:r.taken_at }); S.info.screenshotsToday = r.count_today;
      const inp = $("#osShotIn"); if(inp) inp.value = "";
    } else {
      const r = await call("/api/osint/urlscan-scan", { url, confirmed:true });
      note(`urlscan.io scan submitted (${r.visibility}). Refresh the lookup in about a minute.`);
      window.open(r.result, "_blank", "noopener");
    }
  }catch(err){ note(`${kind==="shot"?"Screenshot":"urlscan.io"}: ${err.message}`); }
  render();
}
async function add(raw){
  const parts = raw.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length){ S.err = "Enter a value."; return render(); }
  try{
    const r = await call("/api/osint/validate", { indicators: parts });
    let added = 0;
    for(const { indicator, type } of r.ok){ if(!find(indicator)){ S.items.push({ value:indicator, type, verdict:"Not checked", note:"", manual:false, hidden:false, lookup:null }); added++; } }
    const skipped = r.rejected.map(x=>`${x.value} (${x.reason.replace(/\.$/,"")})`);
    S.err = skipped.length ? `${added?`Added ${added}. `:""}Not added: ${skipped.join("; ")}` : added ? "" : "Already in the list.";
  }catch(err){ S.err = err.message; }
  render();
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); note("Copied"); }
  catch(e){ const r=document.createRange(); const pre=$("#osText"); if(pre){ r.selectNodeContents(pre); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); note("Press Ctrl+C to copy"); } }
}

document.addEventListener("click", ev => {
  const vb = ev.target.closest(".views button");
  if(vb){ setView(vb.dataset.view); return; }
  const b = ev.target.closest("[data-os]");
  if(!b || !$("#osint").contains(b) || b.tagName==="SELECT" || b.tagName==="INPUT") return;
  const v = b.dataset.v, it = v && find(v), act = b.dataset.os;
  if(act==="run" && it) run(it, false);
  else if(act==="refresh" && it) run(it, true);
  else if(act==="all") (async()=>{ for(const x of [...S.items]) await run(x, false); })();
  else if(act==="rm"){ S.items = S.items.filter(x=>x.value!==v); render(); }
  else if(act==="hide" && it){ it.hidden = !it.hidden; render(); }
  else if(act==="shot" && it) confirmRun("shot", it.type==="domain" ? `https://${it.value}` : it.value);
  else if(act==="scan" && it) confirmRun("scan", it.type==="domain" ? `https://${it.value}` : it.value);
  else if(act==="copy") copyText(S.defang ? defangText(summary()) : summary());
  else if(act==="copyshot") copyText(v);
  else if(act==="rmshot"){ S.shots = S.shots.filter(x=>x.url!==v); render(); }
  else if(act==="clear"){ if(window.confirm("Clear all OSINT indicators, results and screenshot links?")){ S.items=[]; S.shots=[]; S.err=""; render(); } }
  else if(act==="lock"){ S.info=null; S.code=""; ss.set("dqp-osint-code", null); render(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.id==="osDefang"){ S.defang = t.checked; ls.set("dqp-osint-defang", t.checked?"1":"0"); render(); return; }
  if(t.dataset?.os==="verdict"){ const it = find(t.dataset.v); if(it){ it.verdict = t.value; it.manual = t.value!=="Not checked"; render(); } }
  if(t.dataset?.os==="note"){ const it = find(t.dataset.v); if(it){ it.note = t.value; render(); } }
});
document.addEventListener("submit", ev => {
  if(ev.target.id==="osLock"){ ev.preventDefault(); unlock($("#osCode").value.trim()); }
  if(ev.target.id==="osAdd"){ ev.preventDefault(); add($("#osAddIn").value); }
  if(ev.target.id==="osShot"){ ev.preventDefault(); confirmRun("shot", $("#osShotIn").value); }
});

async function setView(view){
  const osint = view==="osint";
  document.body.classList.toggle("view-osint", osint);
  $("#osint").hidden = !osint;
  document.querySelectorAll(".views button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.view===view)));
  try{ sessionStorage.setItem("dqp-view", view); }catch(e){}
  if(!osint) return;
  if(S.server===null){
    try{ S.server = await call("/api/osint/status"); }catch(err){ S.server = false; }
    if(S.server && S.server.enabled && S.code && !S.info){ await unlock(S.code); return; }
  }
  render();
}
let startView = "queries"; try{ startView = sessionStorage.getItem("dqp-view") || "queries"; }catch(e){}
if(startView==="osint") setView("osint");
})();
</script>
